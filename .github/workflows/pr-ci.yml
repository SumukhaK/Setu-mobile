name: PR CI

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  android:
    name: Android CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Android checks
        run: ./gradlew testDebugUnitTest detekt lint
