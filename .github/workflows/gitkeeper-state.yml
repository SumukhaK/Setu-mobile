name: GitKeeper state

on:
  workflow_run:
    workflows: ["PR CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Classify PR state and update approved labels
        run: node scripts/gitkeeper/workflow-run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
